# secure-launch gate: runs the ledger checks and the repo's mutation-proven
# security tests on every push to main and every pull request (solo repos
# push to main directly; shared repos use PRs), and fails on any FAIL. UNKNOWN is
# reported as a warning AND blocks, unless that check id is accepted in
# security/accepted.json with a reason and a ruling date: never a silent pass.
# Installed by secure-gate/scripts/install_gate.py --with-ci (vendors .secure-launch/).
# A PR can edit what judges it (.secure-launch/, security/accepted.json,
# security/gate.json, .gitleaks*): add CODEOWNERS on those paths so changes to
# the gate need the owner's review.
name: secure-launch
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  secure-launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # the secret scan reads full history
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
      - name: Install dependencies (for the security tests and the built-code check)
        run: npm ci
      - name: Build (the built-code load check reads dist/)
        run: npm run build --if-present
      # The ledger goes to the runner's temp folder, never the checkout, so a
      # ledger committed in the PR can never be the one the gate reads. A crash
      # (exit 4) fails here; FAIL and UNKNOWN (1, 3) are left for the gate to judge.
      - name: Run the secure-launch checks
        run: |
          set +e
          python3 .secure-launch/secure-core/scripts/secure_launch.py . --out "$RUNNER_TEMP/secure-launch"
          rc=$?
          echo "orchestrator exit $rc (0 pass, 1 fail, 3 unknown, 4 crashed)"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ] && [ "$rc" -ne 3 ]; then exit 1; fi
      - name: Gate (refuses on FAIL and on unaccepted UNKNOWN; checks the ledger is this run's)
        run: python3 .secure-launch/secure-gate/scripts/gate.py "$RUNNER_TEMP/secure-launch/findings.json" --repo . --tests-from security/gate.json --max-age-hours 1
      - name: Keep the ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secure-launch-ledger
          path: ${{ runner.temp }}/secure-launch/
